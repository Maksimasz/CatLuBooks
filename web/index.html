<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="RAG-ассистент по книгам и документам">
  <title>CatLuBooks</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> CatLuBooks</div>
    <div class="controls">
      <select id="provider" title="Провайдер модели"></select>
      <input id="model" list="model-list" placeholder="модель" title="Модель" autocomplete="off" spellcheck="false">
      <datalist id="model-list"></datalist>
      <button id="keybtn" type="button" title="Ввести API-ключ">🔑</button>
    </div>
  </header>

  <div class="subbar">
    <span id="stats">загрузка…</span>
    <span id="status"></span>
  </div>

  <main id="chat" class="chat"></main>

  <p class="hint" id="hint">Например: «рецепт минестроне», «как приготовить плов»</p>

  <form id="composer" class="composer">
    <textarea id="input" rows="1" placeholder="Спросите что-нибудь…" autocomplete="off"></textarea>
    <button id="send" type="submit" aria-label="Отправить">➤</button>
  </form>

  <script src="/app.js?v=5"></script>
</body>
</html>
